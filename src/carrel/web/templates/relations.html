{% extends "base.html" %}
{% block title %}论文关系 · Carrel{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/graph.css?v={{ static_v }}"><link rel="stylesheet" href="/static/graph-explorer.css?v={{ static_v }}">{% endblock %}
{% block content %}
<section class="explorer" data-graph-explorer data-preference-key="{{ library_key|default('local') }}" data-view="graph">
  <header class="explorer-head">
    <h1>论文关系</h1>
    <nav class="explorer-view-switch" aria-label="图谱视图">
      <button type="button" data-view="graph" aria-pressed="true"><span class="explorer-view-dot"></span>关系图</button>
      <button type="button" data-view="tree" aria-pressed="false"><span class="explorer-view-dot"></span>脉络图</button>
    </nav>
  </header>
  <div class="explorer-surface">
    <div class="explorer-scope-bar">
      <nav class="explorer-directions" data-directions aria-label="研究方向"><button type="button" class="explorer-scope-button" data-overview>总览</button></nav>
      <label class="explorer-collection" data-collection-control hidden>阅读集合<select data-collection-scope aria-label="阅读集合范围"><option value="">全部集合</option></select></label>
    </div>
    <nav class="explorer-subdirections" data-subdirections aria-label="细分研究方向" hidden></nav>
    <div class="explorer-workspace-head">
      <div class="explorer-scope-caption"><button type="button" class="btn tiny" data-back hidden aria-label="返回上个图谱">← 返回</button><strong data-scope-title>研究方向</strong><span class="explorer-count" data-summary></span></div>
      <div class="explorer-locate">
        <form data-locate-form role="search"><span aria-hidden="true">⌖</span><input type="search" data-locate-input aria-label="定位论文" placeholder="定位论文 · 方法名或标题" autocomplete="off" aria-controls="explorer-locate-results" aria-expanded="false"><button type="submit" class="btn tiny">定位</button></form>
        <div class="explorer-locate-results" id="explorer-locate-results" data-locate-results hidden></div>
        <span class="sr-only" data-locate-feedback role="status" aria-live="polite"></span>
      </div>
    </div>
    <div class="graph-workspace" data-renderer data-graph-started="true">
      <div class="graph-body"><div class="graph-stage">
        <svg class="graph-canvas" data-graph-canvas tabindex="0" role="application" aria-label="论文图，拖动平移，滚轮缩放，方向键选择节点，回车展开"></svg>
        <p class="graph-status" data-graph-status role="status"></p>
        <div class="explorer-state" data-state="loading"><span class="explorer-state-dot" aria-hidden="true"></span><span data-feedback role="status" aria-live="polite">加载中</span><button type="button" class="btn tiny" data-retry hidden>重试</button></div>
        <div class="explorer-canvas-tools">
          <button type="button" class="btn tiny" data-graph-home title="以适合阅读的字号查看">阅读视角</button><button type="button" class="btn tiny" data-graph-fit>全览视角</button>
          <span class="explorer-zoom"><button type="button" class="btn tiny" data-graph-zoom="out" aria-label="缩小">−</button><output data-graph-zoom-value>100%</output><button type="button" class="btn tiny" data-graph-zoom="in" aria-label="放大">+</button></span>
        </div>
        <div class="explorer-legend" data-legend></div>
      </div></div>
      <details class="graph-nodes"><summary>节点列表（<span data-graph-node-total>0</span>）</summary><div data-graph-node-list></div></details>
    </div>
    <footer class="explorer-footer">
      <div><button type="button" class="btn tiny" data-more hidden>展开更多</button><span data-boundary></span></div>
      <details class="explorer-options"><summary>图谱选项</summary><div class="explorer-options-body">
        <label data-neighbor-control hidden>相关论文<select data-neighbor-limit><option value="5">最多 5 篇</option><option value="10">最多 10 篇</option><option value="20">最多 20 篇</option></select></label>
        <span data-group-edges><label><input type="checkbox" data-cites>引用连线</label><label>连线上限<select data-edge-limit><option value="40">40 条</option><option value="80">80 条</option><option value="160">160 条</option></select></label></span>
        <label><input type="checkbox" data-similar>相似连线</label><label data-context-control hidden><input type="checkbox" data-context>补充前驱上下文</label>
        <button type="button" class="btn tiny" data-refresh>刷新图谱</button><button type="button" class="btn tiny" data-graph-export="svg" data-export-scope="all">导出 SVG</button><button type="button" class="btn tiny" data-graph-export="png" data-export-scope="viewport">导出 PNG</button>
        <span data-snapshot></span>
        <form class="explorer-branch-label" data-branch-label-form hidden><label>主线名称<input data-branch-label name="label" maxlength="60"></label><button class="btn tiny" type="submit">保存</button><span data-branch-label-feedback role="status"></span></form>
      </div></details>
    </footer>
  </div>
  <details class="explorer-message" data-processing-message hidden><summary><span class="explorer-message-icon" aria-hidden="true">!</span><span data-processing-summary></span></summary><div data-processing-details></div></details>
  <aside class="explorer-detail" data-detail hidden aria-label="论文详情"><button class="btn tiny" data-detail-close>关闭详情</button><div data-detail-body></div></aside>
  <noscript>请启用 JavaScript 查看论文关系图。</noscript>
</section>
{% endblock %}
{% block scripts %}<script src="/static/graph-layout-loader.js?v={{ static_v }}"></script><script src="/static/graph.js?v={{ static_v }}"></script><script src="/static/graph-explorer.js?v={{ static_v }}"></script>{% endblock %}
