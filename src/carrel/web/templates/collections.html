{% extends "base.html" %}
{% block title %}阅读集合 · Carrel{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/sync.css?v={{ static_v }}">{% endblock %}
{% block breadcrumb %}<a href="/">论文库</a><span>/</span><span>阅读集合</span>{% endblock %}
{% block content %}
<header class="page-head"><div><p class="eyebrow">我的阅读安排</p><h1>阅读集合</h1></div><div class="settings-row-actions"><a class="btn" href="/sync">{{ icon('folder-input') }}同步目录</a><button class="btn primary" type="button" id="collection-add">{{ icon('plus') }}新建集合</button></div></header>
<div id="collection-list"></div>
<script type="application/json" id="collections-data">{{ collections|tojson }}</script>
<dialog class="edit-dialog" id="collection-dialog" aria-labelledby="collection-dialog-title"><form id="collection-form">
  <div class="dialog-head"><h2 id="collection-dialog-title">阅读集合</h2><button type="button" class="icon-btn" data-close-dialog title="关闭" aria-label="关闭">{{ icon('x') }}</button></div>
  <input name="id" type="hidden"><label for="collection-name">集合名称</label><input id="collection-name" name="name" required maxlength="160">
  <label for="collection-note">备注</label><textarea id="collection-note" name="note" rows="3" maxlength="10000"></textarea>
  <p class="form-error" role="alert" hidden></p><div class="dialog-actions"><button class="btn" type="button" data-close-dialog>取消</button><button class="btn primary" type="submit">{{ icon('check') }}保存</button></div>
</form></dialog>
{% endblock %}
{% block scripts %}<script src="/static/notes.js?v={{ static_v }}"></script>{% endblock %}
